# Beispiel für den HTTPS-server-Block; NICHT im öffentlichen Webroot ablegen.
# Vorher bestehende location-Regeln, Hosting-Proxy und Assets prüfen.
server_tokens off;
# Keine regulären Zugriffslogs; Hosting-/Proxy-Logs separat prüfen.
access_log off;
# Nur kritische Serverfehler; betriebliche Diagnose bei Bedarf befristet aktivieren.
error_log /var/log/nginx/agrarservice-error.log crit;
autoindex off;
client_max_body_size 1k; # reine statische Seite ohne Upload/Formular-POST
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; media-src 'none'; manifest-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cache-Control "no-store, max-age=0" always;
add_header Pragma "no-cache" always;
add_header X-Robots-Tag "noarchive" always;
# HSTS erst nach vollständiger Prüfung aller HTTPS-Endpunkte aktivieren:
# add_header Strict-Transport-Security "max-age=31536000" always;
location ~ /\. { return 404; }
location ~* \.(?:bak|old|orig|swp|sql|sqlite|env|ini|log|conf|zip|tar|gz|map)$ { return 404; }
# Keine unnötigen Methoden; nur bei statischer Website ohne API anwenden:
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
